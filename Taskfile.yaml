# https://taskfile.dev

version: "3"

vars:
  HUGO_VERSION: "0.164.0"
  HUGO_RELEASES: https://github.com/gohugoio/hugo/releases/download/

tasks:
  install:hugo:
    status:
      - test -x bin/hugo
      - ./bin/hugo version | grep -q "hugo v{{.HUGO_VERSION}}"
    vars:
      ARCH: '{{if eq OS "darwin"}}universal{{else}}{{ARCH}}{{end}}'
    cmds:
      - mkdir -p bin
      - wget {{.HUGO_RELEASES}}v{{.HUGO_VERSION}}/hugo_extended_{{.HUGO_VERSION}}_{{OS}}-{{.ARCH}}.tar.gz
      - defer: rm hugo_*.tar.gz
      - tar -xvf hugo_*.tar.gz -C bin
      - ./bin/hugo version

  install:theme:
    status:
      - test -d themes/hugo-book
    cmds:
      - wget https://github.com/alex-shpak/hugo-book/archive/refs/tags/v0.14.0.tar.gz
      - defer: rm v0.14.0.tar.gz
      - tar -xvf ./v0.14.0.tar.gz
      - mkdir -p themes/
      - mv hugo-book-* themes/hugo-book

  install:
    desc: "Install all dependencies"
    cmds:
      - task: install:hugo
      - task: install:theme

  serve:
    desc: "Run dev server"
    deps:
      - install
    cmds:
      - ./bin/hugo server {{.CLI_ARGS}}

  build:
    desc: "Run dev server"
    deps:
      - install
    cmds:
      - ./bin/hugo {{.CLI_ARGS}}
